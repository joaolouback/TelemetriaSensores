# Integração contínua do app: a cada push e PR, roda o lint (regras do Expo)
# e o typecheck do TypeScript. O build do APK continua sendo feito pelo EAS.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
